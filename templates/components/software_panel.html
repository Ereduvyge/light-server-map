<section id="software-panel" data-node-id="{{ node.id }}"
         hx-get="/components/nodes/{{ node.id }}/software"
         hx-trigger="every 10s" hx-target="this" hx-swap="outerHTML">
    <h2 id="software-dialog-title">{{ node.name }}</h2>
    <p class="dialog-subtitle">Node #{{ node.id }} <span aria-hidden="true">&middot;</span> {{ node.ip }}</p>
    <div class="software-list">
        {% for software in node.softwares|sort(attribute='id') %}
            {% include "components/software.html" %}
        {% else %}
            <p class="dialog-empty">No software is linked to this node yet.</p>
        {% endfor %}
    </div>
</section>
