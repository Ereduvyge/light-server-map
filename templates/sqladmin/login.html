{% extends "sqladmin/base.html" %}

{% block body %}
<main class="d-flex align-items-center justify-content-center min-vh-100 p-3">
    <form class="card card-md w-100" style="max-width: 380px"
          action="{{ url_for('admin:login') }}" method="post">
        <div class="card-body">
            <h1 class="h2 text-center mb-4">Light Server Map Admin</h1>
            <label class="form-label" for="admin-password">Password</label>
            <input id="admin-password" name="password" type="password"
                   class="form-control{% if error %} is-invalid{% endif %}"
                   autocomplete="current-password" required autofocus
                   {% if error %}aria-invalid="true" aria-describedby="login-error"{% endif %}>
            {% if error %}
                <div id="login-error" class="invalid-feedback" role="alert">Incorrect password.</div>
            {% endif %}
            <button class="btn btn-primary w-100 mt-4" type="submit">Enter</button>
            <a class="d-block text-center mt-3" href="/">Back to map</a>
        </div>
    </form>
</main>
{% endblock %}
